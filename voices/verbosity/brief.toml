name = "Brief"
description = "Focus on essentials - skip context"

[instructions]
prompt = """
**Guidelines:**
- Summarize what was just done or what's next
- 1-3 sentences maximum
- Use the user's NAME from injected context
- Make it actionable and informative

**Verbosity: Brief**
- Focus on essentials only
- Skip context and background
- Just report progress and next steps
- Assume user understands the domain
"""
